# Archivo compartido. Se modifica solo por solicitud de cambio aprobada.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", "datos", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["contratos", "backend"]

[tool.pytest.ini_options]
# La raiz del repositorio entra al path de importacion. Sin esto, `pytest` a
# secas falla con "No module named 'backend'": el script de consola no agrega el
# directorio actual al path, mientras que `python -m pytest` si lo hace. Las dos
# formas de invocar tienen que dar el mismo resultado, porque si no el CI y la
# maquina de quien escribe la prueba discrepan. Encontrado en el PR #110.
pythonpath = ["."]
# `backend/` y no `backend/tests`, desde el 2026-08-27.
#
# Apuntaba solo a la carpeta de Luna, asi que las pruebas que cada quien escribe
# junto a su modulo **no las ejecutaba nadie**: 46 de Cesar -de H6.2 y H1.4-
# quedaban invisibles mientras el CI reportaba 130 en verde.
#
# Es I-06 otra vez: el CI corriendo pytest de una forma que ninguna persona usa.
# Con `backend/` se recogen 176 y no hace falta que nadie mueva sus archivos a la
# carpeta de otro.
testpaths = ["backend"]
python_files = ["test_*.py"]
addopts = "-ra"
