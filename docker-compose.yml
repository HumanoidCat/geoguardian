# Levanta el entorno completo de GeoGuardian.
#
#   docker compose up -d
#
# Los servicios se agregan conforme se construyen. Hoy solo la base de datos:
# la API y el frontend entran cuando existan sus Dockerfile (historias H6.1 y H5.1).

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geoguardian-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoguardian}
      POSTGRES_USER: ${POSTGRES_USER:-geoguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      # UTF8 con ordenamiento independiente del idioma del sistema.
      # No se usa --locale=es_ES.UTF-8: esa configuracion regional no viene
      # generada en la imagen base y initdb falla, dejando el contenedor en
      # bucle de reinicio. Ver incidencia I-02.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-CR"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Los scripts de init-db corren UNA sola vez, cuando el volumen esta vacio.
      # Si se modifican, hay que borrar el volumen para que vuelvan a ejecutarse.
      - ./infra/docker/init-db:/docker-entrypoint-initdb.d:ro
      # Carpeta para respaldos: la usa la historia H1.10
      - ./infra/docker/respaldos:/respaldos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoguardian} -d ${POSTGRES_DB:-geoguardian}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 256mb

  # Los dos servicios de abajo los agrego Cesar en la historia H6.0, con la
  # excepcion concedida el 26 de agosto: docker-compose.yml es archivo compartido
  # y el permiso cubre SOLO agregar estos dos bloques. El servicio `db` no se
  # toco. Ver docs/07-propiedad-archivos.md.

  api:
    build:
      # El contexto es la raiz del repositorio, no infra/docker: la API importa
      # `contratos/` y `basedatos/`, que viven arriba.
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: geoguardian-api
    container_name: geoguardian-api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoguardian}
      POSTGRES_USER: ${POSTGRES_USER:-geoguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      # Dentro de la red de Docker la base se alcanza por el nombre del servicio,
      # no por localhost.
      #
      # Ojo con el nombre: `conexion.py` lee SOLO `POSTGRES_HOST_LOCAL`, que se
      # llamo asi porque los guiones del ETL corren desde la maquina anfitriona,
      # fuera de esta red. Aqui adentro ese nombre queda enganoso —lo que se pone
      # es el nombre del servicio, no algo local— y aun asi es la variable que hay
      # que definir. Renombrarla toca los guiones de H1.1 y H1.2, asi que se deja
      # y se declara. `POSTGRES_HOST` se define por coherencia con .env; hoy
      # `conexion.py` no la lee.
      POSTGRES_HOST: db
      POSTGRES_HOST_LOCAL: db
      POSTGRES_PORT: 5432
      # El repositorio contra PostgreSQL llega con H6.2 y todavia no tiene tabla
      # para diez de sus dieciseis metodos, asi que el simulado sigue siendo el
      # valor por omision. Ver backend/api/dependencias.py.
      GEOGUARDIAN_REPOSITORIO: ${GEOGUARDIAN_REPOSITORIO:-simulado}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        # No basta con que el contenedor exista: tiene que aceptar conexiones. El
        # servicio db ya declara su healthcheck y aqui se espera a que pase.
        condition: service_healthy

  visor:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: geoguardian-visor
    container_name: geoguardian-visor
    restart: unless-stopped
    ports:
      - "${VISOR_PORT:-5173}:80"
    depends_on:
      # Sin condicion de salud: el visor arranca igual y su cliente cae al
      # respaldo estatico declarandolo, que es lo que pide el criterio CA-3 de
      # H6.6. Obligarlo a esperar haria que una API caida deje al visor sin
      # levantar, que es peor.
      - api

volumes:
  datos_db:
    name: geoguardian_datos_db
