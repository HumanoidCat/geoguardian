# Entorno de produccion.
#
# Recibe despliegue solo con aprobacion explicita y tiene reversion automatica
# (historia H11.4). Es el unico con mas memoria reservada y el que se usa en la
# demostracion de la feria.
#
# "Produccion" aqui significa el namespace de produccion del cluster k3d local,
# no un sistema en operacion real. El manual de operacion (H13.2) tiene que
# decirlo asi. Ver D-05.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geoguardian-produccion

resources:
  - namespace.yaml
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: produccion

patches:
  - target:
      kind: StatefulSet
      name: postgis
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
