name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  contratos:
    name: Contratos y simulados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar lo minimo para verificar contratos
        run: pip install pydantic==2.10.4
      - name: Verificar que los simulados cumplen los contratos
        run: python -m contratos.verificar

  gestion:
    name: Backlog y documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Estos cuatro verificadores existen por errores que ya ocurrieron:
      #   backlog    -> tres dependencias apuntaban a sprints posteriores (semana 4)
      #   adr        -> la rubrica exige seis registros y hay que probar que estan
      #   evidencias -> 30 de 82 historias no tenian carpeta destino
      #   documentacion -> cinco cifras desfasadas en dos dias (accion 12.2)
      - name: El backlog es consistente
        run: python docs/herramientas/verificar_backlog.py
      - name: Los registros ADR estan completos
        run: python docs/herramientas/verificar_adr.py
      - name: Toda historia tiene carpeta de evidencia
        run: python docs/herramientas/verificar_cobertura_evidencias.py docs/backlog.csv
      # Necesita pydantic porque corre contratos.verificar para contar sus
      # comprobaciones en lugar de confiar en un numero escrito a mano.
      - name: Instalar lo minimo para contar las comprobaciones de contratos
        run: pip install pydantic==2.10.4
      - name: Las cifras de la documentacion siguen siendo ciertas
        run: python docs/herramientas/verificar_documentacion.py

  calidad:
    name: Linter y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.8.4
      - name: Revisar estilo
        run: ruff check .
      - name: Revisar formato
        run: ruff format --check .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El paso se salta limpiamente mientras frontend/package.json no exista, y
      # empieza a exigir de verdad cuando entre el andamiaje de H5.1. Se agrega
      # antes que el codigo a proposito: un pipeline que aparece despues de que
      # el codigo ya esta escrito no evita nada.
      - name: Hay proyecto de frontend?
        id: existe
        run: |
          if [ -f frontend/package.json ]; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          else
            echo "si=false" >> "$GITHUB_OUTPUT"
            echo "Todavia no hay frontend/package.json. Pendiente de la historia H5.1."
          fi
      - uses: actions/setup-node@v4
        if: steps.existe.outputs.si == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm ci
      - name: Revisar estilo
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Construir
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm run build --if-present

  pruebas:
    name: Pruebas contra PostgreSQL
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geoguardian_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d geoguardian_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar que PostGIS responde
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("host=localhost port=5432 dbname=geoguardian_test user=ci password=ci") as c:
              print("PostGIS disponible:", c.execute("SELECT postgis_version()").fetchone()[0])
          PY
      - name: Ejecutar la suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: geoguardian_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        run: |
          # El salto solo sigue aqui porque este arreglo tiene que entrar antes
          # que el PR #110, que es el que trae la primera prueba. Apenas ese PR
          # este integrado, el salto se convierte en fallo: si no hay pruebas es
          # que alguien las borro, y eso tiene que salir en rojo.
          if [ -z "$(find backend/tests -name 'test_*.py' -print -quit)" ]; then
            echo "Sin pruebas todavia. Pendiente del PR #110."
            exit 0
          fi
          # Se invoca con `python -m` a proposito, igual que el resto de los
          # controles del proyecto. El script `pytest` a secas no agrega el
          # directorio actual al path de importacion y falla con "No module
          # named 'backend'". `pyproject.toml` tambien lo cubre con `pythonpath`,
          # de modo que las dos formas funcionan.
          python -m pytest backend/tests -v --cov=backend --cov-report=term-missing
