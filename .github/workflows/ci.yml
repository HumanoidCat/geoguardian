name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  contratos:
    name: Contratos y simulados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar lo minimo para verificar contratos
        run: pip install pydantic==2.10.4
      - name: Verificar que los simulados cumplen los contratos
        run: python -m contratos.verificar

  gestion:
    name: Backlog y documentacion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write` desde el 2026-08-26: en `dev` este trabajo **cierra** las issues
      # de historias ya marcadas [x], no solo las reclama. Ver I-13 y el paso 5b
      # de `docs/15-cerrar-una-historia.md`.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Graphviz hace falta para regenerar el entidad-relacion y contrastarlo
      # contra el que esta versionado. Es la unica dependencia de sistema que
      # este trabajo necesita.
      - name: Instalar Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      # Estos cuatro verificadores existen por errores que ya ocurrieron:
      #   backlog    -> tres dependencias apuntaban a sprints posteriores (semana 4)
      #   adr        -> la rubrica exige seis registros y hay que probar que estan
      #   evidencias -> 30 de 82 historias no tenian carpeta destino
      #   documentacion -> cinco cifras desfasadas en dos dias (accion 12.2)
      - name: El backlog es consistente
        run: python docs/herramientas/verificar_backlog.py
      - name: Los registros ADR estan completos
        run: python docs/herramientas/verificar_adr.py
      - name: Toda historia tiene carpeta de evidencia
        run: python docs/herramientas/verificar_cobertura_evidencias.py docs/backlog.csv
      - name: El avance dice lo mismo en los archivos de tareas y en la matriz
        run: python docs/herramientas/verificar_estado.py
      # D-24: el modelo de estimacion es puntos por una constante. No se corrige
      # todavia, se empieza a medir, y esto obliga a que el dato exista.
      - name: Toda historia cerrada declara sus horas estimadas y reales
        run: python docs/herramientas/verificar_horas.py
      # Necesita pydantic porque corre contratos.verificar para contar sus
      # comprobaciones en lugar de confiar en un numero escrito a mano.
      - name: Instalar lo minimo para contar las comprobaciones de contratos
        run: pip install pydantic==2.10.4
      - name: Las cifras de la documentacion siguen siendo ciertas
        run: python docs/herramientas/verificar_documentacion.py
      # El mismo criterio, aplicado a los dibujos: el entidad-relacion se deriva
      # de basedatos/ddl/*.sql, asi que si alguien agrega una tabla y no
      # regenera, el diagrama del documento pasa a mentir. Un diagrama
      # desactualizado es peor que ninguno porque se ve autorizado.
      #
      # No compara bytes: Graphviz no garantiza la misma salida entre versiones
      # y eso pondria el CI en rojo sin que ningun diagrama estuviera mal.
      # Compara el contenido. Ver el encabezado del verificador.
      - name: Los diagramas describen el repositorio de hoy
        run: python docs/herramientas/verificar_diagramas.py
      # El tablero de GitHub era el unico lugar que declara el avance sin una
      # maquina que lo cruzara contra el repositorio. `como-llenar-el-pr.md` ya
      # advertia el modo de fallo -"Cierra H10.1" no cierra nada, GitHub solo
      # entiende "Closes #N"- y la advertencia no bastaba.
      #
      # `gh` viene instalado en el runner y GITHUB_TOKEN le alcanza para leer.
      #
      # SOLO EN `push`, Y ESA CONDICION ES EL PUNTO
      #
      # Los otros seis verificadores comprueban archivos que viajan DENTRO del
      # Pull Request: si fallan, quien abrio el PR puede arreglarlo. Este no. El
      # tablero vive fuera del repositorio y es mutable por cualquiera.
      #
      # Corriendolo en `pull_request` pasa esto, y paso el 24 de agosto: el PR
      # #158 salio en rojo porque una issue ajena estaba mal cerrada. El PR de
      # Luna podria ponerse rojo por algo que el no toco y que quiza no tiene
      # permiso para arreglar.
      #
      # En `push` a dev y main el tablero se sigue vigilando de forma continua,
      # el aviso llega igual, y llega a quien puede corregirlo.
      #
      # Y LA CONDICION TIENE QUE NOMBRAR LAS DOS RAMAS, NO SOLO `push`
      #
      # Decia `github.event_name == 'push'` a secas, que incluye **cada push a
      # cada rama de trabajo**. El comentario de arriba decia "a dev y main"
      # desde el primer dia y la condicion nunca lo dijo.
      #
      # Mientras el verificador solo advertia, eso pasaba desapercibido: en una
      # rama atrasada daba un verde falso, que es la razon por la que el 25 de
      # agosto se le puso el guardarrail de rama. Desde ese momento **se planta
      # con codigo 1**, y el resultado fue que toda rama de trabajo empezo a
      # salir en rojo por diseno. El PR #171 no podia pasar nunca.
      #
      # Es I-12. Un control correcto conectado con la condicion equivocada no
      # protege de nada y bloquea todo.
      - name: El tablero de issues dice lo mismo que el repositorio
        if: >-
          github.event_name == 'push'
          && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # En `dev` se corrige; en `main` se reclama.
        #
        # `Closes #N` esta inerte en `dev` -GitHub solo cierra al fusionar a la
        # rama por omision- asi que cada historia fusionada dejaba el CI en rojo
        # esperando un `gh issue close` a mano. Y no habia orden que lo evitara:
        # cerrar antes del merge dispara la discrepancia contraria. Es I-13.
        #
        # En `main` no hace falta: ahi `Closes #N` funciona solo. Si aun asi
        # queda algo abierto, es que el PR no llevaba el enlace, y eso si merece
        # que una persona lo mire.
        run: |
          gh issue list --state all --limit 300 --json number,title,state,stateReason > /tmp/issues.json
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            python docs/herramientas/verificar_issues.py --issues /tmp/issues.json --corregir
          else
            python docs/herramientas/verificar_issues.py --issues /tmp/issues.json --comandos
          fi

  calidad:
    name: Linter y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.8.4
      - name: Revisar estilo
        run: ruff check .
      - name: Revisar formato
        run: ruff format --check .
      # Una marca de conflicto sin resolver puede pasar los demas controles: si
      # las dos versiones del bloque son iguales, el archivo dice lo correcto y
      # los verificadores lo dan por bueno. Paso en el PR #126. Ver I-07.
      #
      # Una marca son exactamente siete caracteres. El separador va anclado al
      # final del renglon, porque las salidas de los verificadores que se pegan
      # en las evidencias llevan lineas de 66 y 74 signos de igual, y sin anclar
      # darian falso positivo en cuatro archivos.
      - name: Ninguna marca de conflicto sin resolver
        run: |
          if git grep -nE "^(<{7} |={7}$|>{7} )" -- . ; then
            echo "::error::Hay marcas de conflicto de fusion sin resolver."
            exit 1
          fi
          echo "Sin marcas de conflicto."

  # Los manifiestos de entrega continua. Historias H11.2 a H11.4.
  #
  # POR QUE ESTA COMPROBACION VIVE EN EL CI Y NO SOLO EN EL CD.
  #
  # `cd.yml` solo corre sobre `main`. Sin esto, un manifiesto roto se fusionaria
  # a `dev`, de ahi a `main`, y recien alli se descubriria — con el despliegue
  # como primer aviso.
  #
  # `--manifiestos` no necesita cluster: comprueba estructura e invariantes.
  # Entre ellas la de SC-07, que una barra final en DESTINO_API produce
  # `//distritos` sin fallar al arrancar y sin aparecer en ningun registro.
  #
  # **Este trabajo tiene que estar en la lista de verificaciones obligatorias de
  # `dev`.** Si no lo esta, corre, sale en rojo y no impide fusionar: es I-25
  # otra vez, y la observacion (c) del PR #229 ya cayo en eso una vez.
  entrega-continua:
    name: Manifiestos de despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - name: Los manifiestos de infra/k8s cumplen sus invariantes
        run: python infra/verificar_cd.py --manifiestos
      - name: El guion de despliegue no tiene errores de sintaxis
        run: bash -n infra/k8s/desplegar.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El paso se salta limpiamente mientras frontend/package.json no exista, y
      # empieza a exigir de verdad cuando entre el andamiaje de H5.1. Se agrega
      # antes que el codigo a proposito: un pipeline que aparece despues de que
      # el codigo ya esta escrito no evita nada.
      - name: Hay proyecto de frontend?
        id: existe
        run: |
          if [ -f frontend/package.json ]; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          else
            echo "si=false" >> "$GITHUB_OUTPUT"
            echo "Todavia no hay frontend/package.json. Pendiente de la historia H5.1."
          fi
      - uses: actions/setup-node@v4
        if: steps.existe.outputs.si == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm ci
      - name: Revisar estilo
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Construir
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm run build --if-present
      # La escala de riesgo y la marca de seleccion se comprueban por
      # colorimetria: luminancia monotona, contraste WCAG, y que el orden
      # sobreviva a las tres dicromacias. Lo escribio Avril con la escala.
      #
      # Entra al CI el 24 de agosto porque nacio apagado: 22 comprobaciones
      # buenas que solo corrian cuando alguien se acordaba. Es el aprendizaje de
      # I-10 -una regla que ninguna maquina comprueba se cumple mientras alguien
      # se acuerda- aplicado al control mismo.
      #
      # Sin `--if-present`: si el archivo desaparece, esto tiene que salir en
      # rojo. Un control que se salta solo se ve igual que uno que pasa, y esa
      # es la incidencia I-06.
      - name: La escala de riesgo cumple los criterios de accesibilidad
        if: steps.existe.outputs.si == 'true'
        run: python frontend/herramientas/verificar_escala.py
      # El mapa de calor se pintaba sobre el rectangulo que encierra al canton:
      # 23,8 % de la superficie caia sobre los cantones vecinos y el 20,7 % del
      # canton quedaba sin pintar. Vivio cuatro dias en el sitio publico porque
      # solo se veia mirando la pantalla, que es la misma clase de defecto que
      # I-06 e I-10.
      #
      # Esta herramienta corre dibujarSuperficie() de verdad sobre un canvas
      # simulado y contrasta lo pintado contra una implementacion independiente
      # de punto-en-poligono. Ver I-14 y D-30.
      #
      # Sin `--if-present` ni `continue-on-error`: si desaparece, esto sale en
      # rojo. Un control que se salta solo se ve igual que uno que pasa.
      - name: La capa de calor se recorta contra los poligonos
        if: steps.existe.outputs.si == 'true'
        run: node frontend/herramientas/verificar_recorte_calor.mjs
      # Cuarenta comprobaciones de la transformacion a CRTM05, sin vigilancia
      # hasta hoy: entro con H5.6 y quedo corriendo solo cuando alguien se
      # acordaba, que es exactamente lo que I-10 dejo escrito que no sirve.
      #
      # Corre Node por dentro para importar el modulo real del visor, asi que
      # necesita las dos cosas -node y pyproj- y las dos ya estan en el runner.
      #
      # Sin `--if-present`: si desaparece, esto sale en rojo.
      - name: La transformacion a CRTM05 coincide con pyproj
        if: steps.existe.outputs.si == 'true'
        run: |
          python -m pip install --quiet pyproj
          python frontend/herramientas/verificar_proyeccion.py

  pruebas:
    name: Pruebas contra PostgreSQL
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geoguardian_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d geoguardian_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar que PostGIS responde
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("host=localhost port=5432 dbname=geoguardian_test user=ci password=ci") as c:
              print("PostGIS disponible:", c.execute("SELECT postgis_version()").fetchone()[0])
          PY
      - name: Ejecutar la suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: geoguardian_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        run: |
          # La suite existe desde el PR #110. El paso ya no se salta.
          #
          # Mientras se saltaba, este trabajo salio en verde dos semanas sin haber
          # ejecutado nunca, y el defecto que escondia solo aparecio cuando alguien
          # escribio la primera prueba. Es la incidencia I-06: un paso protegido
          # por una condicion que lo salta no es un control, es un control apagado
          # que se ve igual que uno encendido.
          #
          # Si no hay pruebas, es que alguien las borro. Eso tiene que salir en rojo.
          if [ -z "$(find backend/tests -name 'test_*.py' -print -quit)" ]; then
            echo "::error::No hay ninguna prueba en backend/tests. La suite existe desde el PR #110; si desaparecio, es un defecto."
            exit 1
          fi
          # Se invoca con `python -m` a proposito, igual que el resto de los
          # controles del proyecto. El script `pytest` a secas no agrega el
          # directorio actual al path de importacion y falla con "No module
          # named 'backend'". `pyproject.toml` tambien lo cubre con `pythonpath`,
          # de modo que las dos formas funcionan.
          #
          # La ruta es `backend` y no `backend/tests`. Hasta el 2026-08-30 era lo
          # segundo, y por eso el CI NUNCA ejecuto las 46 pruebas de
          # `backend/api/test_repositorio_postgres.py` y
          # `backend/etl/test_imputacion.py`: existen, pasan, y vivian fuera del
          # unico directorio que el CI miraba.
          #
          # `testpaths = ["backend"]` de pyproject.toml no lo cubria: solo aplica
          # cuando se invoca `pytest` SIN ruta, y aqui se le pasa una.
          #
          # Es I-06 otra vez, en su forma mas incomoda: quien corria pytest en su
          # maquina veia pasar esas 46 y concluia que estaban cubiertas. El CI no
          # las habia ejecutado ni una vez. Un control apagado que se ve igual que
          # uno encendido.
          #
          # **Y ESTA LINEA YA SE REVIRTIO UNA VEZ.** El PR #212, de H11.1, la
          # devolvio a `backend/tests` al reescribir esta seccion desde una copia
          # vieja del archivo. Estuvo dos dias asi y **el CI siguio en verde**,
          # porque las 46 pruebas que dejo de correr pasan igual. Ver **I-21**.
          #
          # Si vas a tocar este trabajo, no reescribas el bloque: edita la linea.
          python -m pytest backend -v --cov=backend --cov-report=term-missing

      # Los dos verificadores de criterios de aceptacion viven aca porque este es
      # el unico trabajo que instala requirements.txt, y los dos necesitan
      # FastAPI. No necesitan la base: usan el cliente de pruebas.
      #
      # El de H6.1 estaba escrito desde el 19 de agosto y no lo corria nadie mas
      # que su autor a mano. Un control que solo se ejecuta cuando alguien se
      # acuerda no es un control.
      #
      # Se invocan con `python -m` por la misma razon que la suite: ejecutar
      # `python backend/api/verificar_h61.py` a secas falla con "No module named
      # 'backend'". Es el mismo defecto de la incidencia I-06.
      - name: Los criterios de H6.1 se cumplen
        run: python -m backend.api.verificar_h61
      - name: Los criterios de H6.6 se cumplen
        run: python docs/herramientas/verificar_h66.py
      # H3.0 es la variable objetivo de toda la epica de modelado, asi que un
      # defecto aca contamina todo lo que venga despues sin dar sintomas: un
      # etiquetado con fuga temporal produce metricas excelentes y un modelo
      # inservible.
      #
      # No necesita la base: comprueba propiedades del etiquetado sobre series
      # construidas a mano, donde la respuesta correcta se conoce.
      - name: Los criterios de H3.0 se cumplen
        run: python -m backend.modelado.verificar_h30
      - name: Los criterios de H3.2 se cumplen
        run: python -m backend.modelado.verificar_h32
      - name: Los criterios de H3.1 se cumplen
        run: python -m backend.modelado.verificar_h31
      # H3.6 fija COMO se comparan los estimadores, y su CA-7 es el unico control
      # que cruza dos caminos independientes hasta la misma cifra: `comparar.py`
      # a traves del contrato `Estimador`, y `evaluar_linea_base.py` llamando a
      # las lineas base directo. Si el adaptador introdujera cualquier diferencia
      # de trato, las dos rutas divergirian y esto sale rojo.
      #
      # Corre siempre. `datos/procesados/etiquetas.csv` no esta versionado, asi
      # que en el CI **nunca** esta: un paso condicionado a su existencia habria
      # quedado verde sin ejecutar nada. Cuando falta, el verificador construye
      # etiquetas sinteticas deterministas y lo declara en su primera linea.
      - name: Los criterios de H3.6 se cumplen
        run: python -m backend.modelado.verificar_h36
      # La comparacion de escalas del SPI. Corre con `--sintetico` porque la
      # precipitacion vive en la base y aqui no hay base; la bandera lo declara
      # en su primera linea de salida y el propio modulo advierte que con datos
      # sinteticos **no concluye nada** sobre las escalas.
      #
      # Entonces, ¿que protege este paso? Que el camino de calculo corra entero:
      # firmas, importaciones, el ajuste gamma por mes en las tres escalas, y el
      # contraste contra el catalogo, que **si** es el catalogo real y esta
      # versionado. La primera version usaba codigos de distrito inventados y
      # daba «cero eventos contrastables»: verde, sin medir nada. Es I-06 otra vez.
      - name: La comparacion de escalas del SPI corre entera
        run: python -m backend.modelado.comparar_escalas_spi --sintetico
      # Escritos por Cesar y **sin correr por nadie** hasta hoy: no puede tocar
      # `.github/workflows/`, que es de Alejandro, asi que los escribio con sus
      # historias y quedaron colgando. Un verificador que solo se ejecuta cuando
      # alguien se acuerda no protege de nada: es I-06 y es I-10.
      #
      # Entran ahora y no antes: en el PR #189 se intentaron agregar con sus
      # historias todavia sin fusionar, y un paso que invoca un modulo inexistente
      # pone el CI en rojo sin que haya nada roto. **El orden importa: primero el
      # archivo, despues el paso que lo llama.**
      #
      # No se usa `--if-present` ni ninguna condicion de existencia: un control
      # que se salta solo se ve igual que uno que pasa.
      - name: Los criterios de H6.2 se cumplen
        run: python -m backend.api.verificar_h62
      - name: Los criterios de H1.4 se cumplen
        run: python -m backend.etl.verificar_h14
      # H6.0 y H1.7 necesitan Docker y la base cargada respectivamente, asi que
      # no corren aca. Se declaran para que se vea que la omision es deliberada:
      #   verificar_h60  construye imagenes; pide un demonio Docker
      #   verificar_h17  compara el manifiesto contra la base real
      - name: Los verificadores que necesitan Docker o la base se declaran
        run: |
          echo "verificar_h60 necesita un demonio Docker; se corre a mano."
          echo "verificar_h17 necesita la base cargada; se corre a mano."
          echo "Ver docs/15-cerrar-una-historia.md."

  # ------------------------------------------------------------------------- #
  # H11.5 · Publicar el visor como sitio estatico                              #
  # ------------------------------------------------------------------------- #
  #
  # POR QUE ESTA AQUI Y NO EN UN PANEL DE VERCEL
  #
  # La rubrica de H11.5 es CICD. Un despliegue configurado a mano en un servicio
  # externo se evidencia con una captura de pantalla; uno que vive en este archivo
  # lo puede reproducir cualquiera que tenga el repositorio, y queda sujeto a la
  # misma revision que el resto del codigo.
  #
  # QUE NO ES
  #
  # No despliega la API ni la base de datos: eso sigue fuera de alcance por D-05,
  # y la cadena real de despliegue son H11.1 a H11.4, bloqueadas por H6.0.
  #
  # Lo que se publica es el visor con su respaldo estatico, que es lo que D-23
  # dejo posible sin querer: si la API no responde, el visor lee los JSON del
  # respaldo y lo declara en pantalla.
  #
  # SOLO DESDE MAIN
  #
  # `dev` recibe trabajo a diario. Publicar desde ahi pondria cualquier PR a medio
  # revisar en la URL que se le paso al Comite Municipal de Emergencias.
  # DE QUE DEPENDE, Y DE QUE DEJO DE DEPENDER
  #
  # Depende de `frontend`, que construye lo que se va a publicar. Si eso falla,
  # no hay nada que subir.
  #
  # **Dejo de depender de `gestion`** el 2026-08-26. Ese trabajo comprueba el
  # backlog, la matriz y **el tablero de issues**, que vive fuera del repositorio
  # y lo puede mover cualquiera. Con el acople, una issue abierta en GitHub -algo
  # que no toca ni una linea del visor- impedia que el sitio se republicara.
  #
  # Y no fallaba de forma visible: el trabajo aparecia **omitido**, no rojo. Paso
  # el 24 de agosto y costo una hora de buscar por que el despliegue no habia
  # corrido.
  #
  # `gestion` sigue corriendo y sigue saliendo en rojo cuando el tablero deriva.
  # Lo que ya no hace es decidir si el visor sale al aire.
  publicar-visor:
    name: Publicar el visor (H11.5)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Construir el visor
        working-directory: frontend
        run: npm run build
      # Se vuelve a comprobar sobre el artefacto REAL que se va a subir, no sobre
      # el repositorio. Es la unica forma de detectar que una ruta absoluta de
      # raiz se colo en el bundle: en el codigo se ve bien y solo falla al
      # servirla desde un subdirectorio.
      - name: Los criterios de H11.5 se cumplen sobre el dist construido
        run: python docs/herramientas/verificar_h115.py --dist frontend/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4

  # =========================================================================== #
  # H11.1 · Construir las imagenes y publicarlas en ghcr.io
  # =========================================================================== #
  #
  # QUE PUBLICA Y CUANDO
  #
  # En **todo** PR y en toda rama las imagenes se **construyen**, porque un
  # Dockerfile que no compila tiene que salir en rojo antes de fusionarse. Pero
  # solo se **publican** desde `main` y `dev`: un registro con una imagen por
  # rama de trabajo es un registro que nadie puede leer.
  #
  # LAS ETIQUETAS INCLUYEN EL SHA, Y NO ES ADORNO
  #
  # Con solo `latest` no hay forma de responder «que version esta desplegada»,
  # que es exactamente la pregunta que aparece cuando algo se rompe en
  # produccion. Cada imagen se etiqueta con el SHA del commit **y** con el
  # nombre de la rama; `latest` se agrega solo desde `main`.
  #
  # H11.2, H11.3 y H11.4 despliegan **por SHA**, no por `latest`. Desplegar una
  # etiqueta movil significa que dos despliegues del mismo nombre pueden ser
  # cosas distintas, y entonces el rollback deja de estar definido.
  #
  # NO HACE FALTA NINGUN SECRETO
  #
  # `GITHUB_TOKEN` alcanza para publicar en ghcr.io del mismo repositorio, con
  # el permiso `packages: write` declarado abajo. Un secreto manual seria una
  # cosa mas que rota y que alguien tiene que renovar.
  imagenes:
    name: Imagenes Docker (H11.1)
    needs: [contratos, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # `fail-fast: false` a proposito: si la API no compila, igual interesa
      # saber si el visor si. Con el corte por omision, el segundo fallo queda
      # sin diagnosticar.
      fail-fast: false
      matrix:
        include:
          - nombre: api
            contexto: .
            dockerfile: infra/docker/api.Dockerfile
          - nombre: visor
            contexto: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # El nombre del paquete va en minusculas: ghcr.io las exige y el usuario
      # de este repositorio tiene mayusculas. Sin esto el push falla con un
      # error que no menciona las mayusculas en ningun lado.
      - name: Nombre del paquete en minusculas
        id: destino
        run: echo "ruta=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.nombre }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.destino.outputs.ruta }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      # El login va condicionado igual que el push: en un PR desde una bifurcacion
      # el token no tiene permiso de escritura, y un login que falla ahi seria un
      # rojo que no dice nada sobre el codigo.
      - name: Entrar a ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRIMERO SE CONSTRUYE Y SE CARGA EN EL DEMONIO LOCAL. NO SE PUBLICA.
      #
      # `load: true` es obligatorio y su ausencia fue el defecto de la primera
      # corrida: sin el, `build-push-action` deja la imagen en la cache de
      # buildx y **no** en el demonio, asi que el paso siguiente no la encuentra
      # y el trabajo se cae con «No esta geoguardian-api».
      #
      # La etiqueta es la local, la misma que usa `docker compose`, y no la de
      # ghcr. Fue el otro defecto: el verificador busca `geoguardian-<nombre>` y
      # el build etiquetaba `ghcr.io/humanoidcat/geoguardian/<nombre>:sha-...`.
      # Dos nombres para la misma imagen y nada que los cruzara.
      - name: Construir ${{ matrix.nombre }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: geoguardian-${{ matrix.nombre }}
          labels: ${{ steps.meta.outputs.labels }}
          # La cache de GitHub Actions evita reconstruir las capas de
          # dependencias en cada corrida. Sin esto, `npm ci` y `pip install`
          # vuelven a bajar todo cada vez.
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,scope=${{ matrix.nombre }},mode=max

      # **Se comprueba la imagen construida, no el Dockerfile.** Que el build
      # termine no dice que la imagen arranque: puede faltar un archivo que el
      # .dockerignore excluyo, y eso solo se ve ejecutandola.
      - name: La imagen arranca y responde
        run: python docs/herramientas/verificar_h111.py --imagen ${{ matrix.nombre }}

      # Y SOLO DESPUES SE PUBLICA.
      #
      # El orden importa y en la primera version estaba al reves: se publicaba y
      # despues se comprobaba. Una imagen que no arranca no tiene por que llegar
      # al registro, y menos con la etiqueta `latest`: quien la baje se lleva un
      # contenedor muerto y el rojo del CI no se lo impide.
      #
      # Se etiqueta y se empuja con el CLI en vez de reconstruir: la imagen ya
      # esta en el demonio y verificada. Reconstruirla con `push: true` seria
      # publicar un artefacto **distinto** del que se verifico, aunque el
      # contenido coincida.
      - name: Publicar ${{ matrix.nombre }} en ghcr.io
        if: github.event_name == 'push'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r etiqueta; do
            [ -z "$etiqueta" ] && continue
            docker tag geoguardian-${{ matrix.nombre }} "$etiqueta"
            docker push "$etiqueta"
          done
